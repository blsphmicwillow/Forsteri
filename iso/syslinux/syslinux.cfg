# Forsteri OS live medium: BIOS/syslinux menu.
#
# Text mode on purpose. vesamenu needs a background image packed into the
# syslinux directory and a COM32 module for every entry; the graphical menu is
# GRUB's job on installed systems, and a text menu cannot fail to draw.

UI menu.c32
PROMPT 0
TIMEOUT 40
MENU TITLE Forsteri OS Live
MENU COLOR title 1;37;44 #ff0e0e12 #00000000
MENU COLOR sel 7;37;40 #ff0e0e12 #fff2c14e
MENU COLOR unsel 37;40 #ffd7d2c4 #00000000

LABEL forsteri
  MENU LABEL Forsteri OS Live (%ARCH%)
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200 quiet splash loglevel=3 %KERNEL_PARAMS%

LABEL forsteri-safe
  MENU LABEL Forsteri OS Live (no splash, safe graphics)
  LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200 nomodeset %KERNEL_PARAMS%

LABEL reboot
  MENU LABEL Reboot
  COM32 reboot.c32
