#
# pacman.conf for the Forsteri live medium build.
#
# pacman exists here for one reason: archiso builds the live root from Arch
# packages. On an installed Forsteri system, forst is the package manager.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
Color
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
