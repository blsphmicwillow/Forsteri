# /etc/forst/repos.conf -- Forsteri repository codenames.
#
# A spec is `name` (base order: colony, ice, nest) or `codename:name`.
# Groups use `@`: `forst install ice:@plasma`.
#
# format = pacman -> base system, shares /var/lib/forst
# format = deb    -> Debian assets
# format = rpm    -> Fedora assets

[colony]
format      = pacman
url         = https://geo.mirror.pkgbuild.com/core/os/x86_64
db          = core
arch        = x86_64
enabled     = yes
description = Arch core -- the Forsteri base system

[ice]
format      = pacman
url         = https://geo.mirror.pkgbuild.com/extra/os/x86_64
db          = extra
arch        = x86_64
enabled     = yes
description = Arch extra -- desktops, apps, fonts

[nest]
format      = pacman
url         = file:///srv/forsteri/repo/x86_64
db          = nest
arch        = x86_64
enabled     = yes
description = Forsteri's own packages (branding, themes, quickshell, forst)

[tundra]
format      = deb
url         = http://deb.debian.org/debian
suite       = bookworm
component   = main
arch        = amd64
enabled     = yes
description = Debian stable main -- .deb assets

[aurora]
format      = rpm
url         = https://download.fedoraproject.org/pub/fedora/linux/releases/43/Everything/x86_64/os
arch        = x86_64
enabled     = yes
description = Fedora 43 Everything -- .rpm assets
