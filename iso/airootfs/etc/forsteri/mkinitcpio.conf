# Initramfs for the Forsteri live medium.
#
# Kept outside /etc/mkinitcpio.conf because the `mkinitcpio` package owns that
# file and pacstrap would overwrite it. /etc/mkinitcpio.d/linux.preset points
# mkinitcpio here (see that file).
#
# The `archiso` hooks from mkinitcpio-archiso find the ISO, loop-mount the
# squashfs and set up the overlay; `plymouth` draws the Forsteri splash over
# that handover. There is no `autodetect` or `kms` hook on purpose: the medium
# must boot on any GPU, so the image carries every module instead of only the
# ones present on the build machine.
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev plymouth microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
