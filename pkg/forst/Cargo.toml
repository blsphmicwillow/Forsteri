[package]
name = "forst"
version = "0.1.0"
edition = "2021"
description = "Forsteri OS package manager: one minimal binary, many codenames"
license = "MIT"
rust-version = "1.70"

[[bin]]
name = "forst"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
