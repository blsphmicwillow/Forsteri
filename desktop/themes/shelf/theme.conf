NAME=Shelf
FAMILY=Windows
SUMMARY=Flat grey, blue accent, controls on the right, 4px corners.
ACCENT=#0078d4
ACCENT_DARK=#005a9e
BG=#202020
FG=#ffffff
BASE=#1a1a1a
CARD=#2b2b2b
BORDER=#3a3a3a
RADIUS=4
BUTTON_RADIUS=3
FONT="Inter 10"
MONO="JetBrains Mono 10"
