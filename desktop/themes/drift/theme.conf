# drift -- the macOS-like theme: Cupertino glass.
#
# Translucent dark panels, generous radii, controls on the left, a warm amber
# accent instead of Apple's blue so it still reads as Forsteri.
CODENAME=drift
NAME=Drift
FAMILY="macOS"
SUMMARY="Translucent dark panels, traffic lights on the left, 12px radii."
ACCENT=#e6b34a
ACCENT_DARK=#b98a2b
BG=#1c1c1e
FG=#f5f5f7
BASE=#111113
CARD=#2c2c2e
BORDER=#3a3a3c
RADIUS=12
BUTTON_RADIUS=8
FONT="Inter 11"
MONO="JetBrains Mono 10"
BUTTONS="close,minimize,maximize:"
GNOME_ACCENT=yellow
BLUR=yes
