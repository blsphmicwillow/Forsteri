NAME=Ember
FAMILY=Forsteri
SUMMARY=Warm ivory on near-black, one gold accent, soft rounding.
ACCENT=#f2c14e
ACCENT_DARK=#c99a2e
BG=#17171e
FG=#f7f1e1
BASE=#12121a
CARD=#1f1f28
BORDER=#33333f
RADIUS=12
BUTTON_RADIUS=7
FONT="Inter 11"
MONO="JetBrains Mono 10"
BUTTONS="close,minimize,maximize:"
GNOME_ACCENT=yellow
BLUR=yes
