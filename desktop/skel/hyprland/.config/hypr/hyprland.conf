# Forsteri OS -- Hyprland
#
# Super is the "Command" key here: Super+Q closes, Super+Return opens a
# terminal, Super+D opens the launcher. Round corners, soft blur and the gold
# accent come from the Forsteri palette.

monitor = , preferred, auto, 1

# Theme values (accent, radius, blur) come from the selected codename.
# forsteri-theme-apply rewrites this file; the defaults below are `ember`.
source = ~/.config/hypr/theme-vars.conf

$mod = SUPER
$terminal = kitty
$launcher = wofi --show drun
$fileManager = kitty -e forst list

exec-once = swaybg -i /usr/share/backgrounds/forsteri/wallpaper-aurora.png -m fill
exec-once = waybar
exec-once = /usr/local/bin/forsteri-theme-apply
exec-once = hyprctl setcursor Adwaita 24

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = $accent
    col.inactive_border = $inactive
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = $radius
    active_opacity = 1.0
    inactive_opacity = 0.97

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.2
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    bezier = forsteri, 0.25, 0.9, 0.25, 1
    animation = windows, 1, 5, forsteri
    animation = windowsOut, 1, 4, forsteri, popin 90%
    animation = fade, 1, 6, forsteri
    animation = workspaces, 1, 5, forsteri, slide
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# --- window and workspace keys ---------------------------------------------
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $launcher
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod SHIFT, F, togglefloating
bind = $mod, E, exec, $fileManager
bind = $mod, J, togglesplit
bind = $mod, L, exec, loginctl lock-session
bind = $mod, V, togglefloating

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

bind = $mod, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod, P, exec, systemctl poweroff
bind = $mod SHIFT, R, exec, systemctl reboot

# --- media and brightness --------------------------------------------------
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- compositor feel -------------------------------------------------------
windowrule = float, ^(pavucontrol)$
windowrule = float, ^(nm-connection-editor)$
windowrule = size 900 600, ^(pavucontrol)$
layerrule = blur, waybar
